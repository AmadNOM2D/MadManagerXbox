name: Build Xbox MSIX

# Unsigned SideloadOnly MSIX for dev-mode Xbox (option 1: build here, sideload via Device Portal).
# Agent brain runs on the Mac at ws://<mac_ip>:8765; the UWP client is a thin WebView shell.
on:
  workflow_dispatch:
    inputs:
      mac_ip:
        description: 'Mac LAN IP (agent API: ws://IP:8765)'
        required: true
        default: '192.168.12.242'

jobs:
  build:
    name: Compile + package (SideloadOnly, unsigned)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Stage web content into uwp/
        run: |
          Copy-Item -Path web\index.html -Destination uwp\index.html -Force
          $ip = '${{ github.event.inputs.mac_ip }}'
          '{"apiBase":"ws://' + $ip + ':8765"}' | Set-Content -NoNewline -Encoding utf8 -Path uwp\config.json
          Write-Host "config: $(Get-Content uwp\config.json)"

      - name: Install VS Universal (UWP) workload (instruments + uses vswhere installPath)
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { $vswhere = "C:\ProgramData\Chocolatey\bin\vswhere.exe" }
          Write-Host "vswhere = $vswhere (exists=$([bool](Test-Path $vswhere)))"
          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath 2>$null
          if (-not $installPath) { throw "vswhere returned no installPath" }
          Write-Host "VS installPath = $installPath"
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not (Test-Path $installer)) { throw "vs_installer.exe not found at $installer" }
          Write-Host "Running: vs_installer modify --add Microsoft.VisualStudio.Workload.Universal on $installPath"
          & $installer modify --installPath "$installPath" --add Microsoft.VisualStudio.Workload.Universal --includeDependencies --quiet --norestart --nocache *>&1
          Write-Host "vs_installer exit code = $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "vs_installer modify failed (exit $LASTEXITCODE)" }
      - name: Build unsigned MSIX (SideloadOnly)
        run: |
          msbuild "uwp\XboxAgent.csproj" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\Packages" `
            /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed (exit $LASTEXITCODE)" }

      - name: Locate package
        id: pkg
        run: |
          $dir = "$env:GITHUB_WORKSPACE\Packages"
          $f = Get-ChildItem -Path $dir -Recurse -Filter '*.appx' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $f) { $f = Get-ChildItem -Path $dir -Recurse -Filter '*.msix' | Select-Object -First 1 }
          if (-not $f) { throw "No package produced under $dir" }
          "path=$($f.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Appending
          Write-Host "package=$($f.FullName)"

      - name: Upload unsigned MSIX
        uses: actions/upload-artifact@v4
        with:
          name: xbox-agent-msix
          path: ${{ steps.pkg.outputs.path }}
