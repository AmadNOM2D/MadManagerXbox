name: Build Xbox MSIX

# Unsigned SideloadOnly MSIX for dev-mode Xbox (option 1: build here, sideload via Device Portal).
# Agent brain runs on the Mac at ws://<mac_ip>:8765; the UWP client is a thin WebView shell.
on:
  workflow_dispatch:
    inputs:
      mac_ip:
        description: 'Mac LAN IP (agent API: ws://IP:8765)'
        required: true
        default: '192.168.12.242'

jobs:
  build:
    name: Compile + package (SideloadOnly, unsigned)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Stage web content into uwp/
        run: |
          Copy-Item -Path web\index.html -Destination uwp\index.html -Force
          $ip = '${{ github.event.inputs.mac_ip }}'
          '{"apiBase":"ws://' + $ip + ':8765"}' | Set-Content -NoNewline -Encoding utf8 -Path uwp\config.json
          Write-Host "config: $(Get-Content uwp\config.json)"

      - name: Install VS Universal (UWP) workload (--wait so it actually installs)
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath 2>$null
          Write-Host "VS installPath = $installPath"
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          Write-Host "Running vs_installer modify --add Microsoft.VisualStudio.Workload.Universal --includeDependencies --wait --passive --norestart --nocache"
          & $installer modify --installPath "$installPath" --add Microsoft.VisualStudio.Workload.Universal --includeDependencies --wait --passive --norestart --nocache *>&1
          Write-Host "vs_installer exit code = $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "vs_installer modify failed (exit $LASTEXITCODE)" }
          Write-Host "### post-install verification ###"
          Write-Host "VS Uap.targets: $(Test-Path (Join-Path $installPath 'MSBuild\Microsoft\Windows Kits\10\MSBuild\Microsoft.Uap.targets'))"
          Write-Host "SDK Uap.targets: $(Test-Path 'C:\Program Files (x86)\Windows Kits\10\MSBuild\Microsoft.Uap.targets')"
          Write-Host "UAP .uap ref packs (References):"
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\References' -Recurse -Filter '*.uap' -Directory -ErrorAction SilentlyContinue | Select-Object -Expand FullName | Write-Host
          Write-Host "dotnet packs Microsoft.UAP.Ref.*:"
          Get-ChildItem 'C:\Program Files\dotnet\packs' -Filter 'Microsoft.UAP.Ref.*' -Directory -ErrorAction SilentlyContinue | Select-Object -Expand Name | Write-Host

      - name: Build unsigned MSIX (SideloadOnly)
        run: |
          $v = $null
          $p = Get-ChildItem 'C:\Program Files\dotnet\packs' -Filter 'Microsoft.UAP.Ref.*' -Directory -ErrorAction SilentlyContinue |
               Sort-Object { [version]($_.Name -replace 'Microsoft.UAP.Ref.','') } -Descending | Select-Object -First 1
          if ($p) { $v = $p.Name -replace 'Microsoft.UAP.Ref.',''; Write-Host "SDK-style UAP pack: $($p.Name) -> $v" }
          if (-not $v) {
            $rp = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\References' -Recurse -Filter '*.uap' -Directory -ErrorAction SilentlyContinue |
                  Sort-Object { [version]($_.Name -replace '\.uap$','') } -Descending | Select-Object -First 1
            if ($rp) { $v = $rp.Name -replace '\.uap$',''; Write-Host "Legacy UAP ref pack: $($rp.Name) -> $v" }
          }
          if (-not $v) { throw "No UAP reference pack found in dotnet\packs or References -- install VS Universal workload + Win10 SDK UAP refs" }
          $tfm = "uap" + $v
          Write-Host "Using UAP TFM: $tfm"
          (Get-Content 'uwp\XboxAgent.csproj' -Raw) -replace 'uap10\.0\.\d+', $tfm | Set-Content -NoNewline 'uwp\XboxAgent.csproj'
          Write-Host "csproj TFM: $(Select-String -Path 'uwp\XboxAgent.csproj' -Pattern 'TargetFramework')"
          msbuild "uwp\XboxAgent.csproj" /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Never /p:AppxPackageSigningEnabled=false /p:AppxPackageDir="$env:GITHUB_WORKSPACE\Packages" /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed (exit $LASTEXITCODE)" }

      - name: Locate package
        id: pkg
        run: |
          $dir = "$env:GITHUB_WORKSPACE\Packages"
          $f = Get-ChildItem -Path $dir -Recurse -Filter '*.appx' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $f) { $f = Get-ChildItem -Path $dir -Recurse -Filter '*.msix' | Select-Object -First 1 }
          if (-not $f) { throw "No package produced under $dir" }
          "path=$($f.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Appending
          Write-Host "package=$($f.FullName)"

      - name: Upload unsigned MSIX
        uses: actions/upload-artifact@v4
        with:
          name: xbox-agent-msix
          path: ${{ steps.pkg.outputs.path }}
