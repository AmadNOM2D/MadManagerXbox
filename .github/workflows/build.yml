name: Build Xbox MSIX

# Produces a dev-mode-ready MSIX for the Xbox UWP shell (option 1: unsigned/sideload path).
# The agent brain runs on the Mac at ws://<mac_ip>:8765; the UWP client is a thin WebView.
on:
  workflow_dispatch:
    inputs:
      mac_ip:
        description: 'Mac LAN IP (agent API: ws://IP:8765)'
        required: true
        default: '192.168.12.242'
      sign_pw:
        description: 'Password for the dev code-signing certificate'
        required: true
        default: 'HermesDev123'

jobs:
  build:
    name: Compile + Package + Sign
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: action/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve Windows SDK toolchain
        id: tool
        run: |
          $vs = "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $vs)) { $vs = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe" }
          "msbuild=$vs" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $sdk = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "sdk=$sdk" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "msbuild=$vs"
          Write-Host "sdk=$sdk"

      - name: Stage web content into uwp/
        run: |
          Copy-Item -Path web\index.html -Destination uwp\index.html -Force
          $ip = '${{ github.event.inputs.mac_ip }}'
          '{"apiBase":"ws://' + $ip + ':8765"}' | Set-Content -NoNewline -Encoding utf8 -Path uwp\config.json
          Write-Host "config: $(Get-Content uwp\config.json)"

      - name: Create dev signing cert (CN=40459Hermes)
        id: cert
        run: |
          $pw = ConvertTo-SecureString '${{ github.event.inputs.sign_pw }}' -Force -AsPlainText
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=40459Hermes' -KeyUsage DigitalSignature -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -FriendlyName 'HermesXboxDev' -CertStoreLocation 'Cert:\LocalMachine\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')
          Export-PfxCertificate -Cert $cert -FilePath sign.pfx -Password $pw
          "thumb=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "thumb=$($cert.Thumbprint)"

      - name: Build + sign MSIX
        run: |
          $msbuild = "${{ steps.tool.outputs.msbuild }}"
          $thumb  = "${{ steps.cert.outputs.thumb }}"
          if (-not (Test-Path $msbuild)) { throw "MSBuild not found at $msbuild" }
          & $msbuild "uwp\XboxAgent.csproj" /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=None /p:UseDotNetNativeToolchain=true /p:SignManifests=true /p:PackageCertificateThumbprint=$thumb /p:PackageCertificateStoreName=LocalMachine\My /p:PackageCertificatePublisherDisplayName=40459Hermes /m /v:minimal /nr:false
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed (exit $LASTEXITCODE)" }

      - name: Locate package
        id: pkg
        run: |
          $f = Get-ChildItem -Recurse -Filter '*.msix' | Select-Object -First 1
          if (-not $f) { throw "No .msix produced" }
          "path=$($f.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "package=$($f.FullName)"

      - name: Upload MSIX + dev cert
        uses: actions/upload-artifact@v4
        with:
          name: xbox-agent-msix
          path: |
            ${{ steps.pkg.outputs.path }}
            sign.pfx
